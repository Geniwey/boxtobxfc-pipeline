# ==============================================================================
# ⚽ BOX TO BOX FC - PIPELINE v44.0 (PEXELS VÍDEO REAL MEGA POTENCIADO)
# ==============================================================================

name: "Box to Box FC - Pipeline v44.0"

concurrency:
  group: render-b2b-unico
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONIOENCODING: "utf-8"
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"

on:
  repository_dispatch:
    types: [render-video]

permissions:
  contents: write
  actions: write

jobs:
  render-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    outputs:
      youtube_status: ${{ steps.youtube.outputs.youtube_status }}
      video_duration: ${{ steps.audio_bg_gen.outputs.video_duration }}
      titulo_corto: ${{ steps.extraer.outputs.titulo_corto }}

    steps:

      - name: "📂 Checkout del repositorio"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🛠️ Instalar dependencias"
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq --no-install-recommends ffmpeg fontconfig wget curl
          mkdir -p ~/.fonts
          wget -q --timeout=30 -O ~/.fonts/BebasNeue.ttf "https://github.com/google/fonts/raw/main/ofl/bebasneuee/BebasNeue-Regular.ttf" && echo "FONT_NAME=Bebas Neue" >> $GITHUB_ENV || { cp /usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf ~/.fonts/BebasNeue.ttf 2>/dev/null; echo "FONT_NAME=Liberation Sans" >> $GITHUB_ENV; }
          fc-cache -f 2>/dev/null
          python3 -m pip install --quiet openai-whisper edge-tts requests gtts google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client numpy tqdm Pillow --break-system-packages 2>/dev/null || python3 -m pip install --quiet openai-whisper edge-tts requests gtts google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client numpy tqdm Pillow
          python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu --break-system-packages 2>/dev/null || python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: "📝 Extraer y sanear textos"
        id: extraer
        timeout-minutes: 2
        env:
          TITULO_RAW: ${{ github.event.client_payload.titulo }}
          DESCRIPCION_RAW: ${{ github.event.client_payload.descripcion }}
          SCRIPT_RAW: ${{ github.event.client_payload.script_text }}
        run: |
          cat << 'EOF' > payload.json
          ${{ toJson(github.event.client_payload) }}
          EOF

          cat << 'PYTHON_EXTRAER' > /tmp/extraer.py
          import os, sys, re, textwrap
          sys.stdout.reconfigure(encoding='utf-8')

          def clean(t):
              if not t: return ''
              t = t.lstrip('\ufeff').replace('\u00a0', ' ')
              for c in ['\u200b','\u200c','\u200d','\u200e','\u200f','\u2060','\u00ad']: t = t.replace(c, '')
              t = t.replace('\u2019',"'").replace('\u201c','"').replace('\u201d','"')
              return re.sub(r' {2,}', ' ', re.sub(r'\n{3,}', '\n\n', t)).strip()

          def sanitize_tts(t):
              return re.sub(r'[^\w\s\.,;:\?!¡¿áéíóúÁÉÍÓÚñÑüÜ\-]', '', re.sub(r'[\*\"\'\«\»\(\)\[\]\{\}\#\_\|\~]', '', t)).strip()

          titulo = re.sub(r'[\*\"\'\«\»\_\|\~]', '', clean(os.environ.get('TITULO_RAW', ''))).strip()[:100] or '⚽ Box to Box FC'
          descripcion = clean(os.environ.get('DESCRIPCION_RAW', ''))[:5000] or '#WorldCup2026'
          script_text = clean(os.environ.get('SCRIPT_RAW', ''))[:5000] or 'Sigue viendo.'
          script_audio = sanitize_tts(script_text)

          open('titulo.txt','w',encoding='utf-8').write(titulo)
          open('descripcion.txt','w',encoding='utf-8').write(descripcion)
          open('script.txt','w',encoding='utf-8').write(script_text)
          open('script_audio.txt','w',encoding='utf-8').write(script_audio)
          open('titulo_corto.txt','w',encoding='utf-8').write(titulo[:50])

          wrapped = textwrap.fill(re.sub(r'[\*\"\'\«\»]', '', titulo).strip(), width=22, max_lines=3, placeholder='')
          open('hook_text.txt','w',encoding='utf-8').write(wrapped)
          PYTHON_EXTRAER

          python3 /tmp/extraer.py
          echo "titulo_corto=$(python3 -c "print(open('titulo_corto.txt',encoding='utf-8').read().strip())" 2>/dev/null || echo "Box to Box FC")" >> $GITHUB_OUTPUT

      - name: "🎙️🎥 Descargador de Vídeos Reales (Pexels Potenciado)"
        id: audio_bg_gen
        timeout-minutes: 30
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BUSQUEDA: ${{ github.event.client_payload.busqueda_pexels }}
        run: |
          AUDIO_OK=false
          edge-tts --voice "es-ES-AlvaroNeural" --rate="+15%" --volume="+10%" --file script_audio.txt --write-media audio.mp3 2>/dev/null || true
          if [ "$(stat -c%s audio.mp3 2>/dev/null || echo 0)" -gt 5000 ]; then AUDIO_OK=true; fi
          if [ "$AUDIO_OK" = "false" ]; then python3 -c "from gtts import gTTS; gTTS(text=open('script_audio.txt',encoding='utf-8').read(), lang='es').save('audio.mp3')" 2>/dev/null || true; fi

          ffmpeg -y -i audio.mp3 -acodec pcm_s16le -ar 44100 -ac 1 audio.wav 2>/dev/null
          if [ ! -s "audio.wav" ]; then exit 1; fi

          DURACION=$(ffprobe -v quiet -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 audio.wav 2>/dev/null || echo "30")
          DURACION_FINAL=$(python3 -c "print(f'{max(10,min(60,float(\"$DURACION\"))):.2f}')")
          echo "$DURACION_FINAL" > dur.txt
          echo "video_duration=${DURACION_FINAL}" >> $GITHUB_OUTPUT

          cat << 'PYTHON_PEXELS' > /tmp/gen_pexels.py
          import os, sys, random, requests, urllib.parse
          sys.stdout.reconfigure(encoding='utf-8')

          queries_raw = os.environ.get('BUSQUEDA', 'football match,soccer fans,stadium lights')
          queries = [q.strip() for q in queries_raw.split(',') if q.strip()]
          if not queries: queries = ['football match', 'soccer fans', 'stadium stadium']

          pexels_key = os.environ.get('PEXELS_API_KEY', '').strip()
          downloaded_clips = []

          def descargar_video_pexels(query, idx):
              print(f"   ▶️ Buscando VÍDEO REAL en Pexels para: '{query}'...")
              if not pexels_key: return False
              try:
                  # Buscamos vídeos en formato portrait (vertical) para no perder calidad al recortar
                  url = f"https://api.pexels.com/videos/search?query={urllib.parse.quote(query)}&orientation=portrait&per_page=15"
                  res = requests.get(url, headers={'Authorization': pexels_key}, timeout=15).json()
                  
                  if 'videos' in res and len(res['videos']) > 0:
                      # Elegimos un vídeo al azar de entre los mejores resultados
                      video_info = random.choice(res['videos'][:8])
                      best_link = None
                      
                      # Buscamos la calidad HD
                      for f in sorted(video_info['video_files'], key=lambda x: x['width']*x['height'], reverse=True):
                          if f['width'] <= 1080 and f.get('link'):
                              best_link = f['link']
                              break
                      
                      if not best_link and len(video_info['video_files']) > 0:
                          best_link = video_info['video_files'][0]['link']
                      
                      if best_link:
                          video_data = requests.get(best_link, timeout=45).content
                          clip_name = f"raw_clip_{idx}.mp4"
                          with open(clip_name, 'wb') as f: f.write(video_data)
                          
                          norm_name = f"norm_clip_{idx}.mp4"
                          # Filtro FFmpeg: Escala a 1080x1920, recorta, ajusta a 30fps y oscurece un poco para los textos (contraste cinemático)
                          filtro = "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30,eq=contrast=1.05:saturation=1.1:brightness=-0.05"
                          os.system(f'ffmpeg -y -i {clip_name} -vf "{filtro}" -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p -an {norm_name} 2>/dev/null')
                          print(f"   ✅ Clip '{query}' descargado y procesado.")
                          return norm_name
              except Exception as e:
                  print(f"   ⚠️ Fallo al descargar de Pexels: {e}")
              return False

          print("🛡️ Arrancando Motor Pexels Mega Potenciado...")
          for i, q in enumerate(queries):
              clip = descargar_video_pexels(q, i)
              if clip: downloaded_clips.append(clip)

          # Si han fallado búsquedas, rellenamos con genéricas de fútbol
          backup_queries = ["football player", "soccer goal", "stadium crowd"]
          while len(downloaded_clips) < 3 and backup_queries:
              clip = descargar_video_pexels(backup_queries.pop(), len(downloaded_clips))
              if clip: downloaded_clips.append(clip)

          if not downloaded_clips:
              print("   ❌ Pexels falló por completo. Usando fondo oscuro de emergencia.")
              os.system('ffmpeg -y -f lavfi -i "color=c=#0A0B10:s=1080x1920:d=15:r=30" -c:v libx264 -preset ultrafast pexels.mp4 2>/dev/null')
          else:
              print("🎬 Uniendo clips de vídeo...")
              with open('concat_list.txt', 'w') as f:
                  for clip in downloaded_clips:
                      f.write(f"file '{clip}'\n")
              
              os.system('ffmpeg -y -f concat -safe 0 -i concat_list.txt -c copy pexels.mp4 2>/dev/null')
              
              if not os.path.exists('pexels.mp4') or os.path.getsize('pexels.mp4') < 10000:
                  os.system('ffmpeg -y -f lavfi -i "color=c=#0A0B10:s=1080x1920:d=15:r=30" -c:v libx264 -preset ultrafast pexels.mp4 2>/dev/null')
          PYTHON_PEXELS

          python3 /tmp/gen_pexels.py

      - name: "💬 Generar subtítulos animados (Whisper)"
        timeout-minutes: 15
        run: |
          python3 -c "
          import whisper, json, sys
          sys.stdout.reconfigure(encoding='utf-8')
          model = whisper.load_model('small')
          result = model.transcribe('audio.wav', language='es', word_timestamps=True, temperature=0.0, initial_prompt='Análisis táctico y predicciones del Mundial de Fútbol 2026.')
          json.dump(result, open('audio.json','w',encoding='utf-8'), ensure_ascii=False)
          " 2>/dev/null || true

          if [ ! -s "audio.json" ]; then
            python3 -c "
          import json
          t=open('script.txt',encoding='utf-8').read().strip().split()
          d=float(open('dur.txt').read().strip())
          tpw=d/max(len(t),1)
          json.dump({'segments':[{'start':i*tpw,'end':(i+1)*tpw,'words':[{'word':w,'start':i*tpw,'end':(i+1)*tpw}]}for i,w in enumerate(t)]},open('audio.json','w',encoding='utf-8'))
          "
          fi

          cat << 'PYTHON_ASS' > /tmp/gen_ass.py
          import json, os, sys, re
          sys.stdout.reconfigure(encoding='utf-8')

          font_name = os.environ.get('FONT_NAME', 'Bebas Neue')
          highlight_color = "&H0000D7FF&" # Dorado vibrante para los subtítulos

          def fmt(s): return f"{int(s//3600)}:{int((s%3600)//60):02d}:{int(s%60):02d}.{min(int(round((s%1)*100)),99):02d}"
          def clean(t): return re.sub(r' {2,}',' ',t.replace('{','').replace('}','').replace('\\','').replace('\n',' ')).strip()

          try:
              original = open('script.txt', encoding='utf-8').read()
              gold_words = set(re.sub(r'[^\w\s]','',w.strip('*')).upper() for w in original.split() if w.startswith('*') and w.endswith('*') and len(w) > 2)
          except: gold_words = set()

          data = json.load(open('audio.json','r',encoding='utf-8'))
          all_words = [{'word': clean(w.get('word','')), 'start': w.get('start',0.0), 'end': w.get('end',0.0)} for s in data.get('segments',[]) for w in s.get('words',[]) if w.get('word','').strip() and w.get('end',0) > w.get('start',0)]

          # Sombra más gruesa para que se lea perfecto sobre el vídeo real
          header = f"""[Script Info]
          ScriptType: v4.00+
          WrapStyle: 0
          ScaledBorderAndShadow: yes
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,{font_name},108,&H00FFFFFF,&H00FFFFFF,&H00000000,&H99000000,-1,0,0,0,100,100,0,0,3,9,0,5,40,40,255,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """.replace('          ','')

          chunks, cur, chars = [], [], 0
          for i, w in enumerate(all_words):
              w_upper = w['word'].upper().strip()
              clean_w = re.sub(r'[^\w\s]','',w_upper)
              w_text = f"{{\\c{highlight_color}}}{w_upper}{{\\c&H00FFFFFF&}}" if clean_w in gold_words and clean_w else w_upper
              cur.append({'text': w_text, 'start': w['start'], 'end': w['end']})
              chars += len(re.sub(r'\{.*?\}','',w_text))
              if len(cur) >= 2 or chars > 12 or i == len(all_words)-1:
                  chunks.append({'text':' '.join(x['text'] for x in cur),'start':cur[0]['start'],'end':cur[-1]['end']})
                  cur, chars = [], 0

          lines = []
          for i, c in enumerate(chunks):
              end = chunks[i+1]['start'] if i < len(chunks)-1 else c['end']+0.1
              if c['start'] < end:
                  lines.append(f"Dialogue: 0,{fmt(c['start'])},{fmt(end)},Default,,0,0,0,,{{\\fscx82\\fscy82\\t(0,110,\\fscx100\\fscy100)}}{c['text']}")

          open('subtitles.ass','w',encoding='utf-8').write(header+'\n'+'\n'.join(lines))
          PYTHON_ASS

          python3 /tmp/gen_ass.py

      - name: "🎬 Renderizar Vídeo Final Box to Box FC"
        timeout-minutes: 20
        run: |
          DUR=$(cat dur.txt)
          ASS_PATH=$(realpath subtitles.ass)
          ASS_ESC=$(echo "$ASS_PATH" | sed 's/:/\\:/g')
          HOOK_PATH=$(realpath hook_text.txt)
          HOOK_ESC=$(echo "$HOOK_PATH" | sed 's/:/\\:/g')

          if [ ! -f "logo.png" ]; then
            python3 -c "
          from PIL import Image, ImageDraw, ImageFont
          import os
          img = Image.new('RGBA',(320,72),(0,0,0,0))
          draw = ImageDraw.Draw(img)
          draw.rectangle([0,0,320,72],fill=(10,10,10,200))
          try:
              font = ImageFont.truetype(os.path.expanduser('~/.fonts/BebasNeue.ttf'),46)
              draw.text((12,12),'BOX TO BOX FC',font=font,fill='#FFFFFF')
          except:
              draw.text((12,20),'BOX TO BOX FC',fill='#FFFFFF')
          img.save('logo.png')
          " 2>/dev/null || wget -q -O logo.png "https://upload.wikimedia.org/wikipedia/commons/c/ca/1x1.png"
          fi

          # El stream_loop asegura que si los vídeos de Pexels son cortos, se repitan hasta cubrir el audio
          ffmpeg -y -stream_loop -1 -i pexels.mp4 -i audio.wav -i logo.png \
            -filter_complex "[0:v]scale=1080:1920,setsar=1[bg];[2:v]scale=300:-1,colorchannelmixer=aa=0.88[logo];[bg][logo]overlay=W-w-35:H-h-35[bg_logo];[bg_logo]drawtext=fontfile=${HOME}/.fonts/BebasNeue.ttf:textfile='${HOOK_ESC}':fontsize=78:fontcolor=white:borderw=5:bordercolor=black:line_spacing=10:x=(w-text_w)/2:y=(h-text_h)/2-300:enable='lt(t\,1.6)'[hooked];[hooked]subtitles='${ASS_ESC}':fontsdir=~/.fonts[vwithsubs];[vwithsubs]drawbox=x=0:y=0:w='min(iw\,iw*t/${DUR})':h=14:color=0xFFD700@0.95:t=fill[outv]" \
            -map "[outv]" -map 1:a -c:v libx264 -preset fast -crf 22 -pix_fmt yuv420p -r 30 -c:a aac -b:a 192k -t "$DUR" -movflags +faststart output.mp4

      - name: "📺 Publicar en YouTube"
        id: youtube
        continue-on-error: true
        timeout-minutes: 10
        env:
          YOUTUBE_CLIENT_ID_1: ${{ secrets.YOUTUBE_CLIENT_ID_1 }}
          YOUTUBE_CLIENT_SECRET_1: ${{ secrets.YOUTUBE_CLIENT_SECRET_1 }}
          YOUTUBE_REFRESH_TOKEN_1: ${{ secrets.YOUTUBE_REFRESH_TOKEN_1 }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_CLIENT_ID_3: ${{ secrets.YOUTUBE_CLIENT_ID_3 }}
          YOUTUBE_CLIENT_SECRET_3: ${{ secrets.YOUTUBE_CLIENT_SECRET_3 }}
          YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
          YOUTUBE_CLIENT_ID_4: ${{ secrets.YOUTUBE_CLIENT_ID_4 }}
          YOUTUBE_CLIENT_SECRET_4: ${{ secrets.YOUTUBE_CLIENT_SECRET_4 }}
          YOUTUBE_REFRESH_TOKEN_4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 }}
        run: |
          cat << 'PYTHON_YT' > /tmp/subir_yt.py
          import os, sys
          from datetime import datetime, timezone
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError
          sys.stdout.reconfigure(encoding='utf-8')

          orden = [(datetime.now(timezone.utc).hour % 4) + 1] + [i for i in [1, 2, 3, 4] if i != (datetime.now(timezone.utc).hour % 4) + 1]

          def get_creds(idx):
              c_id = os.environ.get(f'YOUTUBE_CLIENT_ID_{idx}', '').strip()
              c_sec = os.environ.get(f'YOUTUBE_CLIENT_SECRET_{idx}', '').strip()
              r_tok = os.environ.get(f'YOUTUBE_REFRESH_TOKEN_{idx}', '').strip()
              if not c_id: return None
              c = Credentials.from_authorized_user_info({'client_id': c_id, 'client_secret': c_sec, 'refresh_token': r_tok, 'token_uri': 'https://oauth2.googleapis.com/token', 'scopes': ['https://www.googleapis.com/auth/youtube.upload']})
              c.refresh(Request())
              return c

          try:
              titulo = open('titulo.txt','r',encoding='utf-8').read().strip()[:100]
              desc = open('descripcion.txt','r',encoding='utf-8').read().strip()[:5000]
              tags = ['mundialdefutbol','mundial2026','futbol','shorts','futbolshorts','worldcup2026','boxtoboxfc','prediccion','tactica']
              body = {'snippet': {'title': titulo, 'description': desc, 'tags': tags, 'categoryId': '17'}, 'status': {'privacyStatus': 'public'}}

              for idx in orden:
                  try:
                      creds = get_creds(idx)
                      if not creds: continue
                      yt = build('youtube', 'v3', credentials=creds)
                      req = yt.videos().insert(part='snippet,status', body=body, media_body=MediaFileUpload('output.mp4', mimetype='video/mp4', resumable=True))
                      resp = None
                      while resp is None: _, resp = req.next_chunk()
                      open('video_id.txt','w').write(resp['id'])
                      print(f"✅ PUBLICADO: https://youtube.com/shorts/{resp['id']}")
                      sys.exit(0)
                  except HttpError as e:
                      if 'uploadLimitExceeded' in e.content.decode(): sys.exit(2)
              sys.exit(1)
          except: sys.exit(1)
          PYTHON_YT

          python3 /tmp/subir_yt.py
          if [ $? -eq 0 ]; then echo "youtube_status=✅ YouTube OK" >> $GITHUB_OUTPUT; else echo "youtube_status=❌ YouTube Falló" >> $GITHUB_OUTPUT; fi

      - name: "🧠 Actualizar memoria"
        if: success()
        env:
          EQUIPO_USADO: ${{ github.event.client_payload.equipo_usado }}
        run: |
          if [ -n "$EQUIPO_USADO" ]; then
            touch ultimos_equipos.txt
            IFS=',' read -ra EQUIPOS_ARR <<< "$EQUIPO_USADO"
            for eq in "${EQUIPOS_ARR[@]}"; do echo "$eq" >> ultimos_equipos.txt; done
            tail -n 10 ultimos_equipos.txt > ultimos_equipos_tmp.txt
            mv ultimos_equipos_tmp.txt ultimos_equipos.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ultimos_equipos.txt
            git commit -m "Memoria: $EQUIPO_USADO" || echo "Sin cambios"
            git push || echo "Push fallido"
          fi
