# ==============================================================================
# ⚽ BOX TO BOX FC - PIPELINE v5.0 (IA VISUAL ENGINE + MULTI-GPU ROTATION)
# ==============================================================================

name: "Box to Box FC - Pipeline v5.0"

concurrency:
  group: render-b2b-unico
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONIOENCODING: "utf-8"
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"

on:
  repository_dispatch:
    types: [render-video]

permissions:
  contents: write
  actions: write

jobs:
  render-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    outputs:
      youtube_status: ${{ steps.youtube.outputs.youtube_status }}
      video_duration: ${{ steps.audio_bg_gen.outputs.video_duration }}
      titulo_corto: ${{ steps.extraer.outputs.titulo_corto }}

    steps:

      - name: "📂 Checkout del repositorio"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🛠️ Instalar dependencias + elegir estilo del vídeo"
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq --no-install-recommends \
            ffmpeg fontconfig wget curl

          echo "🔤 Descargando fuente Bebas Neue..."
          mkdir -p ~/.fonts
          wget -q --timeout=30 \
            -O ~/.fonts/BebasNeue.ttf \
            "https://github.com/google/fonts/raw/main/ofl/bebasneuee/BebasNeue-Regular.ttf" \
            && echo "FONT_NAME=Bebas Neue" >> $GITHUB_ENV \
            || { cp /usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf \
                 ~/.fonts/BebasNeue.ttf 2>/dev/null; \
                 echo "FONT_NAME=Liberation Sans" >> $GITHUB_ENV; }
          fc-cache -f 2>/dev/null

          python3 -m pip install --quiet \
            openai-whisper edge-tts requests gtts \
            google-auth google-auth-oauthlib google-auth-httplib2 \
            google-api-python-client numpy tqdm Pillow \
            --break-system-packages 2>/dev/null || \
          python3 -m pip install --quiet \
            openai-whisper edge-tts requests gtts \
            google-auth google-auth-oauthlib google-auth-httplib2 \
            google-api-python-client numpy tqdm Pillow

          python3 -m pip install --quiet \
            torch --index-url https://download.pytorch.org/whl/cpu \
            --break-system-packages 2>/dev/null || \
          python3 -m pip install --quiet \
            torch --index-url https://download.pytorch.org/whl/cpu

          echo "✅ Dependencias instaladas"

          # ── Elegir estilo visual al azar (0=dorado, 1=cian, 2=coral) ──────
          STYLE_INDEX=$((RANDOM % 3))
          echo "STYLE_INDEX=$STYLE_INDEX" >> $GITHUB_ENV
          if [ "$STYLE_INDEX" = "0" ]; then
            echo "HIGHLIGHT_ASS_COLOR=&H0000D7FF&" >> $GITHUB_ENV
            echo "BAR_COLOR_HEX=0xFFD700" >> $GITHUB_ENV
            echo "EQ_FILTRO=brightness=-0.04:saturation=1.25:contrast=1.08" >> $GITHUB_ENV
            echo "HOOK_Y_OFFSET=-300" >> $GITHUB_ENV
            echo "ESTILO_NOMBRE=DORADO" >> $GITHUB_ENV
          elif [ "$STYLE_INDEX" = "1" ]; then
            echo "HIGHLIGHT_ASS_COLOR=&H00FFE500&" >> $GITHUB_ENV
            echo "BAR_COLOR_HEX=0x00E5FF" >> $GITHUB_ENV
            echo "EQ_FILTRO=brightness=-0.08:saturation=0.95:contrast=1.15" >> $GITHUB_ENV
            echo "HOOK_Y_OFFSET=-260" >> $GITHUB_ENV
            echo "ESTILO_NOMBRE=CIAN" >> $GITHUB_ENV
          else
            echo "HIGHLIGHT_ASS_COLOR=&H000045FF&" >> $GITHUB_ENV
            echo "BAR_COLOR_HEX=0xFF4500" >> $GITHUB_ENV
            echo "EQ_FILTRO=brightness=-0.02:saturation=1.4:contrast=1.0" >> $GITHUB_ENV
            echo "HOOK_Y_OFFSET=-340" >> $GITHUB_ENV
            echo "ESTILO_NOMBRE=CORAL" >> $GITHUB_ENV
          fi

          # ── Elegir movimiento de camara al azar ──
          MOVEMENT_INDEX=$((RANDOM % 4))
          echo "MOVEMENT_INDEX=$MOVEMENT_INDEX" >> $GITHUB_ENV
          if [ "$MOVEMENT_INDEX" = "0" ]; then
            echo "ZOOM_EXPR=zoompan=z='min(max(zoom\,pzoom)+0.0003\,1.22)':d=1:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1080x1920," >> $GITHUB_ENV
          elif [ "$MOVEMENT_INDEX" = "1" ]; then
            echo "ZOOM_EXPR=zoompan=z='min(max(zoom\,pzoom)+0.0007\,1.35)':d=1:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1080x1920," >> $GITHUB_ENV
          elif [ "$MOVEMENT_INDEX" = "2" ]; then
            echo "ZOOM_EXPR=zoompan=z='min(max(zoom\,pzoom)+0.00015\,1.10)':d=1:x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':s=1080x1920," >> $GITHUB_ENV
          else
            echo "ZOOM_EXPR=" >> $GITHUB_ENV
          fi

      - name: "📝 Extraer y sanear textos"
        id: extraer
        timeout-minutes: 2
        env:
          TITULO_RAW: ${{ github.event.client_payload.titulo }}
          DESCRIPCION_RAW: ${{ github.event.client_payload.descripcion }}
          SCRIPT_RAW: ${{ github.event.client_payload.script_text }}
        run: |
          cat << 'EOF' > payload.json
          ${{ toJson(github.event.client_payload) }}
          EOF

          cat << 'PYTHON_EXTRAER' > /tmp/extraer.py
          import os, sys, re, textwrap
          sys.stdout.reconfigure(encoding='utf-8')

          def repair(t):
              if not t: return ''
              try: return t.encode('latin-1').decode('utf-8')
              except: return t

          def clean(t):
              if not t: return ''
              t = t.lstrip('\ufeff').replace('\u00a0', ' ')
              for c in ['\u200b','\u200c','\u200d','\u200e','\u200f','\u2060','\u00ad']:
                  t = t.replace(c, '')
              t = t.replace('\u2019',"'").replace('\u201c','"').replace('\u201d','"')
              return re.sub(r' {2,}', ' ', re.sub(r'\n{3,}', '\n\n', t)).strip()

          def sanitize_tts(t):
              t = re.sub(r'[\*\"\'\«\»\(\)\[\]\{\}\#\_\|\~]', '', t)
              t = re.sub(r'[^\w\s\.,;:\?!¡¿áéíóúÁÉÍÓÚñÑüÜ\-]', '', t)
              return re.sub(r' {2,}', ' ', t).strip()

          titulo_raw = clean(repair(os.environ.get('TITULO_RAW', '')))
          titulo = re.sub(r'[\*\"\'\«\»\_\|\~]', '', titulo_raw).strip()[:100] or '⚽ Box to Box FC'

          desc_raw = clean(repair(os.environ.get('DESCRIPCION_RAW', '')))
          descripcion = desc_raw[:5000] or '#WorldCup2026 #Futbol #Shorts #BoxToBoxFC'

          script_raw = clean(repair(os.environ.get('SCRIPT_RAW', '')))
          script_text = script_raw[:5000] or 'El dato que nadie esperaba. Sigue viendo.'
          script_audio = sanitize_tts(script_text)

          open('titulo.txt','w',encoding='utf-8').write(titulo)
          open('descripcion.txt','w',encoding='utf-8').write(descripcion)
          open('script.txt','w',encoding='utf-8').write(script_text)
          open('script_audio.txt','w',encoding='utf-8').write(script_audio)
          open('titulo_corto.txt','w',encoding='utf-8').write(titulo[:50])

          hook_clean = re.sub(r'[\*\"\'\«\»]', '', titulo).strip()
          wrapped = textwrap.fill(hook_clean, width=22, max_lines=3, placeholder='')
          open('hook_text.txt','w',encoding='utf-8').write(wrapped)
          PYTHON_EXTRAER

          python3 /tmp/extraer.py
          TITULO_CORTO=$(python3 -c "print(open('titulo_corto.txt',encoding='utf-8').read().strip())" 2>/dev/null || echo "Box to Box FC")
          echo "titulo_corto=${TITULO_CORTO}" >> $GITHUB_OUTPUT

      - name: "🎙️🎨 Generar Audio, Imágenes IA y Fondo"
        id: audio_bg_gen
        timeout-minutes: 15
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BUSQUEDA: ${{ github.event.client_payload.busqueda_pexels }}
        run: |
          VOCES=("es-MX-JorgeNeural" "es-ES-AlvaroNeural" "es-AR-TomasNeural" "es-CO-GonzaloNeural" "es-US-AlonsoNeural")
          VOZ_ELEGIDA=${VOCES[$RANDOM % ${#VOCES[@]}]}
          echo "🎙️ Voz elegida: $VOZ_ELEGIDA"

          AUDIO_OK=false
          edge-tts --voice "$VOZ_ELEGIDA" --rate="+8%" --pitch="-2Hz" \
            --file script_audio.txt --write-media audio_v1.mp3 2>/dev/null || true
          if [ "$(stat -c%s audio_v1.mp3 2>/dev/null || echo 0)" -gt 5000 ]; then
            cp audio_v1.mp3 audio.mp3; AUDIO_OK=true
          fi

          if [ "$AUDIO_OK" = "false" ]; then
            edge-tts --voice "es-ES-AlvaroNeural" --rate="+5%" --pitch="-3Hz" \
              --file script_audio.txt --write-media audio_v2.mp3 2>/dev/null || true
            if [ "$(stat -c%s audio_v2.mp3 2>/dev/null || echo 0)" -gt 5000 ]; then
              cp audio_v2.mp3 audio.mp3; AUDIO_OK=true
            fi
          fi

          if [ "$AUDIO_OK" = "false" ]; then
            python3 -c "from gtts import gTTS; gTTS(text=open('script_audio.txt',encoding='utf-8').read(), lang='es').save('audio.mp3')" 2>/dev/null || true
          fi

          ffmpeg -y -i audio.mp3 -acodec pcm_s16le -ar 44100 -ac 1 audio.wav 2>/dev/null
          if [ ! -s "audio.wav" ]; then echo "❌ Audio fallido"; exit 1; fi

          DURACION=$(ffprobe -v quiet -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 audio.wav 2>/dev/null || echo "30")
          DURACION_FINAL=$(python3 -c "print(f'{max(10,min(60,float(\"$DURACION\"))):.2f}')")
          echo "$DURACION_FINAL" > dur.txt
          echo "video_duration=${DURACION_FINAL}" >> $GITHUB_OUTPUT

          cat << 'PYTHON_BG' > /tmp/gen_bg.py
          import os, sys, json, requests, random, urllib.parse, time
          sys.stdout.reconfigure(encoding='utf-8')

          dur_total = float(open('dur.txt').read().strip())
          payload = json.load(open('payload.json', 'r', encoding='utf-8'))
          prompts = payload.get('prompts_imagenes', [])
          if not isinstance(prompts, list): prompts = []

          # INTENTO 1: GENERACIÓN DE IMÁGENES POR IA (ROTACIÓN DE MOTORES)
          ia_images = []
          modelos_ia = ['flux', 'realism', 'turbo', 'default']
          
          if prompts:
              print(f"🎨 Generando {len(prompts)} escenas con IA...")
              for i, p in enumerate(prompts):
                  exito_escena = False
                  safe_p = urllib.parse.quote(p.strip())
                  
                  for intento in range(4):
                      modelo = modelos_ia[intento]
                      url = f"https://image.pollinations.ai/prompt/{safe_p}?width=1080&height=1920&nologo=true&seed={random.randint(1,999999)}&model={modelo}"
                      
                      try:
                          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
                          r = requests.get(url, headers=headers, timeout=25)
                          
                          if r.status_code == 200 and len(r.content) > 30000:
                              img_path = f"ia_img_{i}.jpg"
                              with open(img_path, 'wb') as f: f.write(r.content)
                              ia_images.append(img_path)
                              print(f" ✅ Escena {i+1} OK (Motor: {modelo})")
                              exito_escena = True
                              break
                          elif r.status_code == 429:
                              print(f" ⏳ Status 429. Esperando 10s...")
                              time.sleep(10)
                          else:
                              print(f" ❌ Fallo {r.status_code} (Motor: {modelo})")
                              time.sleep(3)
                      except Exception as e:
                          print(f" ❌ Timeout (Motor: {modelo})")
                          time.sleep(3)
                  
                  time.sleep(4)

          # SUPER SALVAVIDAS: Clonar imágenes si conseguimos entre 2 y 5 (Bypass Pexels)
          if 2 <= len(ia_images) < len(prompts):
              print(f"⚠️ Solo conseguimos {len(ia_images)} imágenes de IA. Clonando para salvar el vídeo...")
              idx = 0
              while len(ia_images) < len(prompts) and len(ia_images) < 6:
                  ia_images.append(ia_images[idx])
                  idx += 1

          if len(ia_images) >= 2:
              print("🎬 Montando slideshow IA perfecto para el audio...")
              dur_img = dur_total / len(ia_images)
              with open('ia_list.txt', 'w', encoding='utf-8') as f:
                  for img in ia_images:
                      f.write(f"file '{img}'\n")
                      f.write(f"duration {dur_img:.3f}\n")
                  f.write(f"file '{ia_images[-1]}'\n")
              
              os.system('ffmpeg -y -f concat -safe 0 -i ia_list.txt -vf "scale=1080:1920:force_original_aspect_ratio=crop,setsar=1,fps=30" -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p pexels.mp4 2>/dev/null')
              
              if os.path.exists('pexels.mp4') and os.path.getsize('pexels.mp4') > 100000:
                  print("✅ Fondo IA generado con éxito!")
                  sys.exit(0)

          # INTENTO 2: PEXELS (Solo si la IA muere al 100%)
          print("⚠️ IA muerta por completo. Rescatando clips de Pexels...")
          api_key = os.environ.get('PEXELS_API_KEY', '').strip()
          query = os.environ.get('BUSQUEDA', '').strip() or 'football stadium world cup'

          FOOTBALL_FALLBACKS = ['football stadium crowd night', 'soccer world cup fans celebration', 'football pitch aerial stadium', 'soccer ball goal net slow motion']

          def search_pexels(q):
              if not api_key: return []
              try:
                  res = requests.get(f"https://api.pexels.com/videos/search?query={q}&orientation=portrait&size=medium&per_page=15", headers={'Authorization': api_key}, timeout=15).json()
                  links = []
                  for v in res.get('videos', []):
                      for f in sorted(v['video_files'], key=lambda x: x['width']*x['height'], reverse=True):
                          if f['width'] <= f['height'] and f.get('link'): links.append(f['link']); break
                  return links
              except: return []

          links = search_pexels(query)
          if not links:
              for fb in FOOTBALL_FALLBACKS:
                  links = search_pexels(fb)
                  if links: break

          random.shuffle(links)
          downloaded = []
          for i, link in enumerate(links[:4]):
              try:
                  r = requests.get(link, timeout=30)
                  if r.status_code == 200:
                      with open(f'clip_{i}.mp4','wb') as f: f.write(r.content)
                      downloaded.append(f'clip_{i}.mp4')
              except: pass
              if len(downloaded) >= 4: break

          if not downloaded:
              os.system('ffmpeg -y -f lavfi -i "color=c=#0A0A0A:s=1080x1920:d=15:r=30" -c:v libx264 -preset ultrafast pexels.mp4 2>/dev/null')
          else:
              with open('concat_list.txt','w') as f:
                  for i, clip in enumerate(downloaded):
                      out = f'norm_{i}.mp4'
                      os.system(f'ffmpeg -y -i {clip} -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30" -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p -an {out} 2>/dev/null')
                      f.write(f"file '{out}'\n")
              os.system('ffmpeg -y -f concat -safe 0 -i concat_list.txt -c copy pexels.mp4 2>/dev/null')
          PYTHON_BG

          python3 /tmp/gen_bg.py

      - name: "💬 Generar subtítulos animados (Whisper)"
        timeout-minutes: 15
        run: |
          python3 -c "
          import whisper, json, sys
          sys.stdout.reconfigure(encoding='utf-8')
          model = whisper.load_model('small')
          result = model.transcribe(
              'audio.wav', language='es',
              word_timestamps=True, temperature=0.0,
              initial_prompt='Análisis táctico y predicciones del Mundial de Fútbol 2026.'
          )
          json.dump(result, open('audio.json','w',encoding='utf-8'), ensure_ascii=False)
          " 2>/dev/null || true

          if [ ! -s "audio.json" ]; then
            python3 -c "
          import json
          t=open('script.txt',encoding='utf-8').read().strip().split()
          d=float(open('dur.txt').read().strip())
          tpw=d/max(len(t),1)
          json.dump({'segments':[{'start':i*tpw,'end':(i+1)*tpw,'words':[{'word':w,'start':i*tpw,'end':(i+1)*tpw}]}for i,w in enumerate(t)]},open('audio.json','w',encoding='utf-8'))
          "
          fi

          cat << 'PYTHON_ASS' > /tmp/gen_ass.py
          import json, os, sys, re
          sys.stdout.reconfigure(encoding='utf-8')

          font_name = os.environ.get('FONT_NAME', 'Bebas Neue')
          highlight_color = os.environ.get('HIGHLIGHT_ASS_COLOR', '&H0000D7FF&')

          def fmt(s):
              s = max(0.0, s)
              return f"{int(s//3600)}:{int((s%3600)//60):02d}:{int(s%60):02d}.{min(int(round((s%1)*100)),99):02d}"

          def clean(t):
              return re.sub(r' {2,}',' ',t.replace('{','').replace('}','').replace('\\','').replace('\n',' ')).strip()

          try:
              original = open('script.txt', encoding='utf-8').read()
              gold_words = set(re.sub(r'[^\w\s]','',w.strip('*')).upper()
                               for w in original.split()
                               if w.startswith('*') and w.endswith('*') and len(w) > 2)
          except:
              gold_words = set()

          data = json.load(open('audio.json','r',encoding='utf-8'))
          all_words = [
              {'word': clean(w.get('word','')), 'start': w.get('start',0.0), 'end': w.get('end',0.0)}
              for s in data.get('segments',[])
              for w in s.get('words',[])
              if w.get('word','').strip() and w.get('end',0) > w.get('start',0)
          ]

          header = f"""[Script Info]
          ScriptType: v4.00+
          WrapStyle: 0
          ScaledBorderAndShadow: yes
          PlayResX: 1080
          PlayResY: 1920

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Default,{font_name},108,&H00FFFFFF,&H00FFFFFF,&H00000000,&H99000000,-1,0,0,0,100,100,0,0,3,9,0,5,40,40,255,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """.replace('          ','')

          chunks, cur, chars = [], [], 0
          for i, w in enumerate(all_words):
              w_upper = w['word'].upper().strip()
              clean_w = re.sub(r'[^\w\s]','',w_upper)
              if clean_w in gold_words and clean_w:
                  w_text = f"{{\\c{highlight_color}}}{w_upper}{{\\c&H00FFFFFF&}}"
              else:
                  w_text = w_upper
              cur.append({'text': w_text, 'start': w['start'], 'end': w['end']})
              chars += len(re.sub(r'\{.*?\}','',w_text))
              if len(cur) >= 2 or chars > 12 or i == len(all_words)-1:
                  chunks.append({'text':' '.join(x['text'] for x in cur),'start':cur[0]['start'],'end':cur[-1]['end']})
                  cur, chars = [], 0

          lines = []
          for i, c in enumerate(chunks):
              end = chunks[i+1]['start'] if i < len(chunks)-1 else c['end']+0.1
              if c['start'] < end:
                  anim = r'{\fscx82\fscy82\t(0,110,\fscx100\fscy100)}'
                  lines.append(f"Dialogue: 0,{fmt(c['start'])},{fmt(end)},Default,,0,0,0,,{anim}{c['text']}")

          open('subtitles.ass','w',encoding='utf-8').write(header+'\n'+'\n'.join(lines))
          PYTHON_ASS

          FONT_NAME=$FONT_NAME HIGHLIGHT_ASS_COLOR=$HIGHLIGHT_ASS_COLOR python3 /tmp/gen_ass.py

      - name: "🎬 Renderizar vídeo Box to Box FC"
        timeout-minutes: 20
        run: |
          DUR=$(cat dur.txt)
          ASS_PATH=$(realpath subtitles.ass)
          ASS_ESC=$(echo "$ASS_PATH" | sed 's/:/\\:/g')
          HOOK_PATH=$(realpath hook_text.txt)
          HOOK_ESC=$(echo "$HOOK_PATH" | sed 's/:/\\:/g')

          if [ ! -f "logo.png" ]; then
            python3 -c "
          from PIL import Image, ImageDraw, ImageFont
          import os
          img = Image.new('RGBA',(320,72),(0,0,0,0))
          draw = ImageDraw.Draw(img)
          draw.rectangle([0,0,320,72],fill=(10,10,10,200))
          try:
              font = ImageFont.truetype(os.path.expanduser('~/.fonts/BebasNeue.ttf'),46)
              draw.text((12,12),'BOX TO BOX FC',font=font,fill='#FFD700')
          except:
              draw.text((12,20),'BOX TO BOX FC',fill='#FFD700')
          img.save('logo.png')
          " 2>/dev/null || wget -q -O logo.png "https://upload.wikimedia.org/wikipedia/commons/c/ca/1x1.png"
          fi

          ffmpeg -y \
            -stream_loop -1 -i pexels.mp4 \
            -i audio.wav \
            -i logo.png \
            -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,${ZOOM_EXPR}eq=${EQ_FILTRO}[bg];[2:v]scale=300:-1,colorchannelmixer=aa=0.88[logo];[bg][logo]overlay=W-w-35:H-h-35[bg_logo];[bg_logo]drawtext=fontfile=${HOME}/.fonts/BebasNeue.ttf:textfile='${HOOK_ESC}':fontsize=78:fontcolor=white:borderw=5:bordercolor=black:line_spacing=10:x=(w-text_w)/2:y=(h-text_h)/2${HOOK_Y_OFFSET}:enable='lt(t\,1.6)'[hooked];[hooked]subtitles='${ASS_ESC}':fontsdir=~/.fonts[vwithsubs];[vwithsubs]drawbox=x=0:y=0:w='min(iw\,iw*t/${DUR})':h=14:color=${BAR_COLOR_HEX}@0.95:t=fill[outv]" \
            -map "[outv]" -map 1:a \
            -c:v libx264 -preset fast -crf 22 -pix_fmt yuv420p -r 30 \
            -c:a aac -b:a 192k \
            -t "$DUR" \
            -movflags +faststart \
            output.mp4 \
            2>&1 | tee ffmpeg.log | tail -5

          if [ ! -f "output.mp4" ] || [ "$(stat -c%s output.mp4)" -lt 100000 ]; then
            ffmpeg -y \
              -stream_loop -1 -i pexels.mp4 \
              -i audio.wav \
              -i logo.png \
              -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,eq=brightness=-0.05:saturation=1.15:contrast=1.05[bg];[2:v]scale=300:-1,colorchannelmixer=aa=0.88[logo];[bg][logo]overlay=W-w-35:H-h-35[bg_logo];[bg_logo]drawtext=fontfile=${HOME}/.fonts/BebasNeue.ttf:textfile='${HOOK_ESC}':fontsize=78:fontcolor=white:borderw=5:bordercolor=black:line_spacing=10:x=(w-text_w)/2:y=(h-text_h)/2-300:enable='lt(t\,1.6)'[hooked];[hooked]subtitles='${ASS_ESC}':fontsdir=~/.fonts[vwithsubs];[vwithsubs]drawbox=x=0:y=0:w='min(iw\,iw*t/${DUR})':h=14:color=0xFFD700@0.95:t=fill[outv]" \
              -map "[outv]" -map 1:a \
              -c:v libx264 -preset fast -crf 22 -pix_fmt yuv420p -r 30 \
              -c:a aac -b:a 192k -t "$DUR" -movflags +faststart \
              output.mp4 2>&1 | tee -a ffmpeg.log | tail -5
          fi

          if [ ! -f "output.mp4" ] || [ "$(stat -c%s output.mp4)" -lt 100000 ]; then exit 1; fi

      - name: "📺 Publicar en YouTube (con failover entre 4 proyectos)"
        id: youtube
        continue-on-error: true
        timeout-minutes: 10
        env:
          YOUTUBE_CLIENT_ID_1: ${{ secrets.YOUTUBE_CLIENT_ID_1 }}
          YOUTUBE_CLIENT_SECRET_1: ${{ secrets.YOUTUBE_CLIENT_SECRET_1 }}
          YOUTUBE_REFRESH_TOKEN_1: ${{ secrets.YOUTUBE_REFRESH_TOKEN_1 }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_CLIENT_ID_3: ${{ secrets.YOUTUBE_CLIENT_ID_3 }}
          YOUTUBE_CLIENT_SECRET_3: ${{ secrets.YOUTUBE_CLIENT_SECRET_3 }}
          YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
          YOUTUBE_CLIENT_ID_4: ${{ secrets.YOUTUBE_CLIENT_ID_4 }}
          YOUTUBE_CLIENT_SECRET_4: ${{ secrets.YOUTUBE_CLIENT_SECRET_4 }}
          YOUTUBE_REFRESH_TOKEN_4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 }}
          EQUIPO_USADO: ${{ github.event.client_payload.equipo_usado }}
        run: |
          cat << 'PYTHON_YT' > /tmp/subir_yt.py
          import os, sys, traceback, unicodedata
          from datetime import datetime, timezone
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError
          sys.stdout.reconfigure(encoding='utf-8')

          def construir_orden_proyectos():
              hora_actual = datetime.now(timezone.utc).hour
              preferido = (hora_actual % 4) + 1
              return [preferido] + [i for i in [1, 2, 3, 4] if i != preferido]

          def construir_credenciales(idx):
              client_id = os.environ.get(f'YOUTUBE_CLIENT_ID_{idx}', '').strip()
              client_secret = os.environ.get(f'YOUTUBE_CLIENT_SECRET_{idx}', '').strip()
              refresh_token = os.environ.get(f'YOUTUBE_REFRESH_TOKEN_{idx}', '').strip()
              if not client_id or not client_secret or not refresh_token: return None
              creds = Credentials.from_authorized_user_info({
                  'client_id': client_id, 'client_secret': client_secret,
                  'refresh_token': refresh_token, 'token_uri': 'https://oauth2.googleapis.com/token',
                  'scopes': ['https://www.googleapis.com/auth/youtube.upload']
              })
              creds.refresh(Request())
              return creds

          def normalizar_tag(texto):
              texto = (texto or '').strip()
              if not texto: return None
              sin_acentos = ''.join(c for c in unicodedata.normalize('NFD', texto) if unicodedata.category(c) != 'Mn')
              tag = sin_acentos.lower().replace(' ', '').replace('-', '')
              return tag if len(tag) > 2 else None

          try:
              orden = construir_orden_proyectos()
              titulo = open('titulo.txt','r',encoding='utf-8').read().strip()[:100]
              desc = open('descripcion.txt','r',encoding='utf-8').read().strip()[:5000]

              tags_equipo_raw = os.environ.get('EQUIPO_USADO', '')
              tags_dinamicos = [normalizar_tag(eq) for eq in tags_equipo_raw.split(',') if normalizar_tag(eq)]

              tags_base = ['mundialdefutbol','mundial2026','futbol','shorts','futbolshorts','worldcup2026','boxtoboxfc','prediccion','pronostico','analisis','tactica','deporte','fifaworldcup','futbol2026']
              tags_finales = list(dict.fromkeys(tags_dinamicos + tags_base))[:30]

              body = {
                  'snippet': {'title': titulo, 'description': desc, 'tags': tags_finales, 'categoryId': '17', 'defaultLanguage': 'es', 'defaultAudioLanguage': 'es'},
                  'status': {'privacyStatus': 'public', 'selfDeclaredMadeForKids': False, 'madeForKids': False}
              }

              exito, canal_lleno = False, False
              for idx in orden:
                  try:
                      creds = construir_credenciales(idx)
                      if creds is None: continue
                      yt = build('youtube', 'v3', credentials=creds)
                      media = MediaFileUpload('output.mp4', mimetype='video/mp4', resumable=True, chunksize=50*1024*1024)
                      req = yt.videos().insert(part='snippet,status', body=body, media_body=media)

                      resp = None
                      while resp is None: status, resp = req.next_chunk()

                      open('video_id.txt','w').write(resp['id'])
                      exito = True
                      break
                  except HttpError as e:
                      error_content = e.content.decode() if hasattr(e, 'content') else str(e)
                      if 'uploadLimitExceeded' in error_content: canal_lleno = True; break
                      continue
                  except Exception: continue

              if canal_lleno: sys.exit(2)
              elif not exito: sys.exit(1)

          except Exception:
              traceback.print_exc()
              sys.exit(1)
          PYTHON_YT

          python3 /tmp/subir_yt.py
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 0 ]; then
            echo "youtube_status=✅ YouTube OK" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "youtube_status=⚠️ Limite diario del canal alcanzado (bajar cadencia)" >> $GITHUB_OUTPUT
          else
            echo "youtube_status=❌ YouTube Falló (los 4 proyectos fallaron)" >> $GITHUB_OUTPUT
          fi

      - name: "🧠 Actualizar memoria anti-repeticion"
        if: success()
        env:
          EQUIPO_USADO: ${{ github.event.client_payload.equipo_usado }}
        run: |
          if [ -n "$EQUIPO_USADO" ]; then
            touch ultimos_equipos.txt
            IFS=',' read -ra EQUIPOS_ARR <<< "$EQUIPO_USADO"
            for eq in "${EQUIPOS_ARR[@]}"; do echo "$eq" >> ultimos_equipos.txt; done
            tail -n 10 ultimos_equipos.txt > ultimos_equipos_tmp.txt
            mv ultimos_equipos_tmp.txt ultimos_equipos.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ultimos_equipos.txt
            git commit -m "Memoria: $EQUIPO_USADO" || echo "Sin cambios"
            git push || echo "Push fallido"
          fi

      - name: "📦 Artifacts de diagnóstico"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "b2b-run-${{ github.run_number }}"
          path: |
            output.mp4
            subtitles.ass
            hook_text.txt
            titulo.txt
            script.txt
            ffmpeg.log
          retention-days: 3
          if-no-files-found: warn
