# ==============================================================================
# ⚽ BOX TO BOX FC - PIPELINE v47.1 (HOTFIX INDENTATION + PILLOW SAFE + YT FIX)
# ==============================================================================

name: "Box to Box FC - Pipeline v47.1"

concurrency:
  group: render-b2b-unico
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONIOENCODING: "utf-8"
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"

on:
  repository_dispatch:
    types: [render-video]

permissions:
  contents: write
  actions: write

jobs:
  render-and-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    outputs:
      youtube_status: ${{ steps.youtube.outputs.youtube_status }}
      video_duration: ${{ steps.audio_bg_gen.outputs.video_duration }}
      titulo_corto: ${{ steps.extraer.outputs.titulo_corto }}

    steps:

      - name: "📂 Checkout del repositorio"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🛠️ Instalar dependencias y fuentes XL"
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq --no-install-recommends ffmpeg fontconfig wget curl fonts-liberation
          mkdir -p "$HOME/.fonts"
          wget -q --timeout=30 -O "$HOME/.fonts/BebasNeue.ttf" "https://github.com/google/fonts/raw/main/ofl/bebasneue/BebasNeue-Regular.ttf" || true
          if [ ! -s "$HOME/.fonts/BebasNeue.ttf" ]; then
            cp /usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf "$HOME/.fonts/BebasNeue.ttf"
            echo "FONT_NAME=Liberation Sans" >> $GITHUB_ENV
          else
            echo "FONT_NAME=Bebas Neue" >> $GITHUB_ENV
          fi
          fc-cache -fv "$HOME/.fonts" >/dev/null 2>&1 || true
          python3 -m pip install --quiet openai-whisper edge-tts requests gtts google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client numpy tqdm Pillow --break-system-packages 2>/dev/null || python3 -m pip install --quiet openai-whisper edge-tts requests gtts google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client numpy tqdm Pillow
          python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu --break-system-packages 2>/dev/null || python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: "📝 Extraer textos y crear Tarjeta TV Permanente (Miniatura y Retención)"
        id: extraer
        timeout-minutes: 3
        env:
          TITULO_RAW: ${{ github.event.client_payload.titulo }}
          TITULO_VIRAL_RAW: ${{ github.event.client_payload.titulo_viral }}
          DESCRIPCION_RAW: ${{ github.event.client_payload.descripcion }}
          SCRIPT_RAW: ${{ github.event.client_payload.script_text }}
          EQUIPO_RAW: ${{ github.event.client_payload.equipo_usado }}
        run: |
          cat << 'EOF' > payload.json
          ${{ toJson(github.event.client_payload) }}
          EOF

          cat << 'PYTHON_EXTRAER' > /tmp/extraer.py
          import os, sys, re, json, textwrap
          from PIL import Image, ImageDraw, ImageFont
          sys.stdout.reconfigure(encoding='utf-8')

          payload = {}
          try:
              payload = json.load(open('payload.json', 'r', encoding='utf-8'))
          except Exception:
              payload = {}

          def clean(t):
              if not t: return ''
              t = str(t).lstrip('\ufeff').replace('\u00a0', ' ')
              for c in ['\u200b','\u200c','\u200d','\u200e','\u200f','\u2060','\u00ad']:
                  t = t.replace(c, '')
              t = t.replace('\u2019',"'").replace('\u201c','"').replace('\u201d','"')
              t = re.sub(r'\[(TITULO|TITULO_VIRAL|DESCRIPCION|GUION|PEXELS_\d|FIN)\]', '', t, flags=re.I)
              return re.sub(r' {2,}', ' ', re.sub(r'\n{3,}', '\n\n', t)).strip()

          def sanitize_tts(t):
              t = re.sub(r'\[(TITULO|TITULO_VIRAL|DESCRIPCION|GUION|PEXELS_\d|FIN)\]', '', t, flags=re.I)
              return re.sub(r'[^\w\s\.,;:\?!¡¿áéíóúÁÉÍÓÚñÑüÜ\%\-]', '', re.sub(r'[\*\"\'\«\»\(\)\[\]\{\}\#\_\|\~]', '', t)).strip()

          raw_title = (
              os.environ.get('TITULO_RAW', '').strip()
              or os.environ.get('TITULO_VIRAL_RAW', '').strip()
              or str(payload.get('titulo') or payload.get('titulo_viral') or '').strip()
          )
          equipo_raw = clean(os.environ.get('EQUIPO_RAW', '') or payload.get('equipo_usado', '') or 'Fútbol')
          equipo = (equipo_raw.splitlines()[0].strip()[:40] if equipo_raw else 'Fútbol') or 'Fútbol'

          clean_title_lines = re.sub(r'[\*\"\'\«\»\_\|\~]', '', clean(raw_title)).splitlines()
          titulo = (clean_title_lines[0].strip()[:90] if clean_title_lines else '')
          if not titulo or titulo == '⚽ Box to Box FC':
              titulo = f"¿Qué pasa realmente con {equipo}? 🚨"

          raw_desc = os.environ.get('DESCRIPCION_RAW', '').strip() or str(payload.get('descripcion') or '').strip()
          descripcion = clean(raw_desc)[:4900] or f"Debate futbolero sobre {equipo}. #Futbol #Shorts #BoxToBoxFC"

          raw_script = os.environ.get('SCRIPT_RAW', '').strip() or str(payload.get('script_text') or '').strip()
          script_text = clean(raw_script)[:4900] or 'Déjame tu opinión en los comentarios.'
          script_audio = sanitize_tts(script_text)

          open('titulo.txt','w',encoding='utf-8').write(titulo)
          open('descripcion.txt','w',encoding='utf-8').write(descripcion)
          open('script.txt','w',encoding='utf-8').write(script_text)
          open('script_audio.txt','w',encoding='utf-8').write(script_audio)
          open('titulo_corto.txt','w',encoding='utf-8').write(titulo[:55])
          open('equipo.txt','w',encoding='utf-8').write(equipo)

          def draw_centered_text(draw_obj, y_center, text_str, font_obj, fill_color):
              try:
                  bbox = draw_obj.textbbox((0, 0), text_str, font=font_obj)
                  tw = bbox[2] - bbox[0]
                  th = bbox[3] - bbox[1]
              except Exception:
                  tw = len(text_str) * 20
                  th = 36
              x_pos = max(40, int((1080 - tw) / 2))
              y_pos = int(y_center - (th / 2))
              draw_obj.text((x_pos, y_pos), text_str, font=font_obj, fill=fill_color)

          img = Image.new('RGBA', (1080, 1920), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)

          for y in range(420):
              alpha = int(175 * (1 - (y / 420.0)))
              draw.line([(0, y), (1080, y)], fill=(5, 7, 12, alpha))
          for y in range(1350, 1920):
              alpha = int(190 * ((y - 1350) / 570.0))
              draw.line([(0, y), (1080, y)], fill=(5, 7, 12, alpha))

          font_path = os.path.expanduser('~/.fonts/BebasNeue.ttf')
          try:
              font_badge = ImageFont.truetype(font_path, 38)
              font_hook = ImageFont.truetype(font_path, 66)
          except Exception:
              font_badge = ImageFont.load_default()
              font_hook = ImageFont.load_default()

          badge_txt = f"BOX TO BOX FC  -  {equipo.upper()}"[:38]
          draw.rounded_rectangle([70, 125, 1010, 182], radius=12, fill=(255, 215, 0, 245))
          draw_centered_text(draw, 148, badge_txt, font_badge, (10, 12, 18, 255))

          hook_clean = re.sub(r'[^\w\s\?!¡¿áéíóúÁÉÍÓÚñÑüÜ\%\:\-]', '', titulo).upper().strip()
          lines = textwrap.wrap(hook_clean, width=22)[:2]
          if not lines:
              lines = [equipo.upper()]

          box_bottom = 292 if len(lines) == 1 else 365
          draw.rounded_rectangle([60, 192, 1020, box_bottom], radius=18, fill=(10, 14, 24, 225), outline=(255, 215, 0, 220), width=4)

          y_text = 236 if len(lines) == 1 else 232
          for line in lines:
              draw_centered_text(draw, y_text, line, font_hook, (255, 255, 255, 255))
              y_text += 72

          img.save('overlay_ui.png')
          print(f"✅ Interfaz y título generados: {titulo}")
          PYTHON_EXTRAER

          python3 /tmp/extraer.py
          echo "titulo_corto=$(python3 -c "print(open('titulo_corto.txt',encoding='utf-8').read().strip())" 2>/dev/null || echo "Box to Box FC")" >> $GITHUB_OUTPUT

      - name: "🎙️🎥 Voz + Pulso Sonoro de Tensión + Pexels Anti-Repetición"
        id: audio_bg_gen
        timeout-minutes: 30
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BUSQUEDA: ${{ github.event.client_payload.busqueda_pexels }}
        run: |
          AUDIO_OK=false
          edge-tts --voice "es-ES-AlvaroNeural" --rate="+16%" --pitch="-2Hz" --volume="+8%" --file script_audio.txt --write-media audio_raw.mp3 2>/dev/null || true
          if [ "$(stat -c%s audio_raw.mp3 2>/dev/null || echo 0)" -gt 5000 ]; then AUDIO_OK=true; fi
          if [ "$AUDIO_OK" = "false" ]; then python3 -c "from gtts import gTTS; gTTS(text=open('script_audio.txt',encoding='utf-8').read(), lang='es').save('audio_raw.mp3')" 2>/dev/null || true; fi

          ffmpeg -y -i audio_raw.mp3 -acodec pcm_s16le -ar 44100 -ac 1 voice_only.wav 2>/dev/null
          if [ ! -s "voice_only.wav" ]; then exit 1; fi

          DURACION=$(ffprobe -v quiet -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 voice_only.wav 2>/dev/null || echo "30")
          DURACION_FINAL=$(python3 -c "print(f'{max(12,min(56,float(\"$DURACION\"))):.2f}')")
          echo "$DURACION_FINAL" > dur.txt
          echo "video_duration=${DURACION_FINAL}" >> $GITHUB_OUTPUT

          cat << 'PYTHON_BGM' > /tmp/gen_bgm.py
          import numpy as np, wave

          dur = float(open('dur.txt').read().strip()) + 1.0
          sr = 44100
          t = np.linspace(0, dur, int(sr * dur), endpoint=False)

          beat_env = np.exp(-6.5 * np.mod(t, 0.666))
          sub_bass = np.sin(2 * np.pi * 58.0 * t) * beat_env * 0.45
          warm_pad = (np.sin(2 * np.pi * 116.0 * t) + 0.5 * np.sin(2 * np.pi * 174.0 * t)) * 0.12
          hook_hit = np.exp(-9.0 * t) * np.sin(2 * np.pi * (95.0 - 40.0 * np.minimum(t, 1.0)) * t) * 0.65

          signal = np.clip((sub_bass + warm_pad + hook_hit) * 0.22, -0.95, 0.95)
          pcm = (signal * 32767).astype(np.int16)

          with wave.open('bgm.wav', 'w') as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(sr)
              wf.writeframes(pcm.tobytes())
          PYTHON_BGM

          python3 /tmp/gen_bgm.py || true

          ffmpeg -y -i voice_only.wav -i bgm.wav -filter_complex "[0:a]volume=1.0[v];[1:a]volume=0.20[b];[v][b]amix=inputs=2:duration=first:dropout_transition=1,loudnorm=I=-16.5:TP=-1.2:LRA=7[outa]" -map "[outa]" -acodec pcm_s16le -ar 44100 -ac 1 audio.wav 2>/dev/null || cp voice_only.wav audio.wav

          cat << 'PYTHON_PEXELS' > /tmp/gen_pexels.py
          import os, sys, json, random, requests, urllib.parse
          sys.stdout.reconfigure(encoding='utf-8')

          used_video_ids = set()
          if os.path.exists('ultimos_pexels_ids.txt'):
              try:
                  for line in open('ultimos_pexels_ids.txt', 'r', encoding='utf-8'):
                      if line.strip():
                          used_video_ids.add(str(line.strip()))
              except Exception:
                  pass

          print(f"🧠 IDs de Pexels bloqueados por historial reciente: {len(used_video_ids)}")

          queries_raw = os.environ.get('BUSQUEDA', '').strip()
          if not queries_raw and os.path.exists('payload.json'):
              try:
                  queries_raw = str(json.load(open('payload.json','r',encoding='utf-8')).get('busqueda_pexels',''))
              except Exception:
                  pass

          queries = [q.strip() for q in queries_raw.split(',') if q.strip()]

          safe_football_pool = [
              "football stadium night", "soccer match action", "football fans cheering",
              "soccer stadium floodlights", "football player kicking ball", "stadium crowd flags",
              "soccer pitch grass", "football goalkeeper gloves", "soccer dribbling ball",
              "aerial football stadium", "ultras football fans", "soccer free kick",
              "football boots turf", "soccer goal net", "stadium tunnel soccer",
              "football players running", "soccer corner flag", "passionate football crowd"
          ]
          random.shuffle(safe_football_pool)
          for b in safe_football_pool:
              if b not in queries:
                  queries.append(b)

          banned_url_terms = [
              'card', 'christmas', 'gift', 'present', 'beer', 'drink', 'wine', 'bar',
              'restaurant', 'table', 'party', 'hockey', 'basketball', 'baseball',
              'tennis', 'golf', 'rugby', 'american-football', 'nfl', 'yoga', 'fitness',
              'dance', 'office', 'business', 'dog', 'cat', 'kitchen', 'couple'
          ]

          pexels_key = os.environ.get('PEXELS_API_KEY', '').strip()
          downloaded_clips = []
          newly_used_ids = []

          def es_video_valido(v):
              vid = str(v.get('id', ''))
              if not vid or vid in used_video_ids:
                  return False
              url_slug = str(v.get('url', '')).lower()
              for term in banned_url_terms:
                  if term in url_slug:
                      return False
              if v.get('duration', 0) < 3:
                  return False
              return True

          def descargar_video_pexels(query, idx):
              if not pexels_key:
                  return False
              try:
                  paginas = [1, 2, 3]
                  random.shuffle(paginas)
                  candidatos = []

                  for pag in paginas:
                      url = f"https://api.pexels.com/videos/search?query={urllib.parse.quote(query)}&orientation=portrait&per_page=25&page={pag}"
                      res = requests.get(url, headers={'Authorization': pexels_key}, timeout=15).json()
                      candidatos = [v for v in res.get('videos', []) if es_video_valido(v)]
                      if candidatos:
                          break

                  if not candidatos:
                      url_any = f"https://api.pexels.com/videos/search?query={urllib.parse.quote(query)}&per_page=25&page={random.choice([1,2])}"
                      res_any = requests.get(url_any, headers={'Authorization': pexels_key}, timeout=15).json()
                      candidatos = [v for v in res_any.get('videos', []) if es_video_valido(v)]

                  if candidatos:
                      random.shuffle(candidatos)
                      video_info = candidatos[0]
                      vid_str = str(video_info.get('id'))
                      used_video_ids.add(vid_str)
                      newly_used_ids.append(vid_str)

                      best_link = None
                      for f in sorted(video_info.get('video_files', []), key=lambda x: (x.get('width',0)*x.get('height',0)), reverse=True):
                          if 540 <= f.get('width', 0) <= 1440 and f.get('link'):
                              best_link = f['link']
                              break

                      if not best_link and video_info.get('video_files'):
                          best_link = video_info['video_files'][0].get('link')

                      if best_link:
                          video_data = requests.get(best_link, timeout=45).content
                          clip_name = f"raw_clip_{idx}.mp4"
                          with open(clip_name, 'wb') as f:
                              f.write(video_data)

                          norm_name = f"norm_clip_{idx}.mp4"
                          filtro = (
                              "scale=1080:1920:force_original_aspect_ratio=increase,"
                              "crop=1080:1920,setsar=1,fps=30,"
                              "eq=contrast=1.14:saturation=1.18:brightness=-0.10"
                          )
                          os.system(f'ffmpeg -y -ss 0.4 -i {clip_name} -t 2.9 -vf "{filtro}" -c:v libx264 -preset fast -crf 22 -pix_fmt yuv420p -an {norm_name} 2>/dev/null')
                          if os.path.exists(norm_name) and os.path.getsize(norm_name) > 8000:
                              print(f"   ✅ Clip #{idx+1} descargado (ID {vid_str} - '{query}').")
                              return norm_name
              except Exception as e:
                  print(f"   ⚠️ Error en Pexels con '{query}': {e}")
              return False

          print("🛡️ Descargando hasta 10 clips únicos de fútbol (cortes de 2.9s)...")
          for q in queries:
              if len(downloaded_clips) >= 10:
                  break
              clip = descargar_video_pexels(q, len(downloaded_clips))
              if clip:
                  downloaded_clips.append(clip)

          with open('nuevos_pexels_ids.txt', 'w', encoding='utf-8') as f:
              for nid in newly_used_ids:
                  f.write(f"{nid}\n")

          if not downloaded_clips:
              os.system('ffmpeg -y -f lavfi -i "color=c=#0A0B10:s=1080x1920:d=15:r=30" -c:v libx264 -preset ultrafast pexels.mp4 2>/dev/null')
          else:
              secuencia = downloaded_clips + random.sample(downloaded_clips, len(downloaded_clips))
              with open('concat_list.txt', 'w') as f:
                  for clip in secuencia:
                      f.write(f"file '{clip}'\n")

              os.system('ffmpeg -y -f concat -safe 0 -i concat_list.txt -c copy pexels.mp4 2>/dev/null')
              if not os.path.exists('pexels.mp4') or os.path.getsize('pexels.mp4') < 10000:
                  os.system('ffmpeg -y -f lavfi -i "color=c=#0A0B10:s=1080x1920:d=15:r=30" -c:v libx264 -preset ultrafast pexels.mp4 2>/dev/null')
          PYTHON_PEXELS

          python3 /tmp/gen_pexels.py

      - name: "💬 Generar Subtítulos Gigantes en Centro de Pantalla (Whisper)"
        timeout-minutes: 15
        run: |
          python3 -c "
          import whisper, json, sys
          sys.stdout.reconfigure(encoding='utf-8')
          model = whisper.load_model('small')
          result = model.transcribe('voice_only.wav', language='es', word_timestamps=True, temperature=0.0, initial_prompt='Debate táctico de fútbol, Champions League, goles, Mundial, entrenadores.')
          json.dump(result, open('audio.json','w',encoding='utf-8'), ensure_ascii=False)
          " 2>/dev/null || true

          if [ ! -s "audio.json" ]; then
            python3 -c "
          import json
          t=open('script.txt',encoding='utf-8').read().strip().split()
          d=float(open('dur.txt').read().strip())
          tpw=d/max(len(t),1)
          json.dump({'segments':[{'start':i*tpw,'end':(i+1)*tpw,'words':[{'word':w,'start':i*tpw,'end':(i+1)*tpw}]}for i,w in enumerate(t)]},open('audio.json','w',encoding='utf-8'))
          "
          fi

          cat << 'PYTHON_ASS' > /tmp/gen_ass.py
          import json, os, sys, re
          sys.stdout.reconfigure(encoding='utf-8')

          font_name = os.environ.get('FONT_NAME', 'Bebas Neue')
          gold_color = "&H0000D7FF&"
          green_color = "&H0050FF00&"

          def fmt(s):
              return f"{int(s//3600)}:{int((s%3600)//60):02d}:{int(s%60):02d}.{min(int(round((s%1)*100)),99):02d}"

          def clean(t):
              return re.sub(r' {2,}', ' ', t.replace('{','').replace('}','').replace('\\','').replace('\n',' ')).strip()

          impact_keywords = {
              'GOL','GOLES','RÉCORD','RECORD','HISTORIA','BRUTAL','CRISIS','FRACASO',
              'MENTIRA','FRAUDE','CAMPEÓN','MUNDIAL','CHAMPIONS','MILLONES','PORCIENTO',
              'NUNCA','NADIE','DESASTRE','COLAPSO','PELIGRO','ERROR','BANQUILLO','LOCURA',
              'IMPOSIBLE','SECRETO','PROBLEMA','VERDAD','ROBO','MILAGRO'
          }

          data = json.load(open('audio.json','r',encoding='utf-8'))
          all_words = [
              {'word': clean(w.get('word','')), 'start': w.get('start',0.0), 'end': w.get('end',0.0)}
              for s in data.get('segments',[])
              for w in s.get('words',[])
              if w.get('word','').strip() and w.get('end',0) > w.get('start',0)
          ]

          header_lines = [
              "[Script Info]",
              "ScriptType: v4.00+",
              "WrapStyle: 0",
              "ScaledBorderAndShadow: yes",
              "PlayResX: 1080",
              "PlayResY: 1920",
              "",
              "[V4+ Styles]",
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
              f"Style: Default,{font_name},134,&H00FFFFFF,&H00FFFFFF,&H00000000,&HB4000000,-1,0,0,0,100,100,2,0,1,11,5,5,70,70,0,1",
              "",
              "[Events]",
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text"
          ]

          chunks, cur, chars = [], [], 0
          for i, w in enumerate(all_words):
              w_upper = w['word'].upper().strip()
              clean_w = re.sub(r'[^\w]','',w_upper)
              has_number = bool(re.search(r'\d', w_upper))
              if has_number:
                  w_text = f"{{\\c{green_color}}}{w_upper}{{\\c&H00FFFFFF&}}"
              elif clean_w in impact_keywords:
                  w_text = f"{{\\c{gold_color}}}{w_upper}{{\\c&H00FFFFFF&}}"
              else:
                  w_text = w_upper

              cur.append({'text': w_text, 'start': w['start'], 'end': w['end']})
              chars += len(re.sub(r'\{.*?\}','',w_text))
              if len(cur) >= 2 or chars > 10 or i == len(all_words)-1:
                  chunks.append({'text':' '.join(x['text'] for x in cur), 'start':cur[0]['start'], 'end':cur[-1]['end']})
                  cur, chars = [], 0

          lines = []
          for i, c in enumerate(chunks):
              end = chunks[i+1]['start'] if i < len(chunks)-1 else c['end'] + 0.18
              if c['start'] < end:
                  lines.append(f"Dialogue: 0,{fmt(c['start'])},{fmt(end)},Default,,0,0,0,,{{\\pos(540,1060)\\fscx80\\fscy80\\t(0,85,\\fscx106\\fscy106)\\t(85,140,\\fscx100\\fscy100)}}{c['text']}")

          open('subtitles.ass','w',encoding='utf-8').write('\n'.join(header_lines + lines))
          PYTHON_ASS

          python3 /tmp/gen_ass.py

      - name: "🎬 Renderizar Vídeo Final Box to Box FC"
        timeout-minutes: 20
        run: |
          DUR=$(cat dur.txt)
          ASS_PATH=$(realpath subtitles.ass)
          ASS_ESC=$(echo "$ASS_PATH" | sed 's/:/\\:/g')
          FONTS_DIR="${HOME}/.fonts"
          FONTS_ESC=$(echo "$FONTS_DIR" | sed 's/:/\\:/g')

          ffmpeg -y -stream_loop -1 -i pexels.mp4 -i audio.wav -i overlay_ui.png \
            -filter_complex "[0:v]scale=1080:1920,setsar=1[bg];[bg][2:v]overlay=0:0[ui];[ui]subtitles='${ASS_ESC}':fontsdir='${FONTS_ESC}'[vwithsubs];[vwithsubs]drawbox=x=0:y=0:w='min(iw\,iw*t/${DUR})':h=16:color=0xFFD700@0.98:t=fill[outv]" \
            -map "[outv]" -map 1:a -c:v libx264 -preset fast -crf 21 -pix_fmt yuv420p -r 30 -c:a aac -b:a 192k -t "$DUR" -movflags +faststart output.mp4

      - name: "📺 Publicar en YouTube (Rotación Real de 4 Cuentas)"
        id: youtube
        continue-on-error: true
        timeout-minutes: 10
        env:
          YOUTUBE_CLIENT_ID_1: ${{ secrets.YOUTUBE_CLIENT_ID_1 }}
          YOUTUBE_CLIENT_SECRET_1: ${{ secrets.YOUTUBE_CLIENT_SECRET_1 }}
          YOUTUBE_REFRESH_TOKEN_1: ${{ secrets.YOUTUBE_REFRESH_TOKEN_1 }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_CLIENT_ID_3: ${{ secrets.YOUTUBE_CLIENT_ID_3 }}
          YOUTUBE_CLIENT_SECRET_3: ${{ secrets.YOUTUBE_CLIENT_SECRET_3 }}
          YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
          YOUTUBE_CLIENT_ID_4: ${{ secrets.YOUTUBE_CLIENT_ID_4 }}
          YOUTUBE_CLIENT_SECRET_4: ${{ secrets.YOUTUBE_CLIENT_SECRET_4 }}
          YOUTUBE_REFRESH_TOKEN_4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 }}
        run: |
          cat << 'PYTHON_YT' > /tmp/subir_yt.py
          import os, sys
          from datetime import datetime, timezone
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError
          sys.stdout.reconfigure(encoding='utf-8')

          hora_idx = (datetime.now(timezone.utc).hour % 4) + 1
          orden = [hora_idx] + [i for i in [1, 2, 3, 4] if i != hora_idx]

          def get_creds(idx):
              c_id = os.environ.get(f'YOUTUBE_CLIENT_ID_{idx}', '').strip()
              c_sec = os.environ.get(f'YOUTUBE_CLIENT_SECRET_{idx}', '').strip()
              r_tok = os.environ.get(f'YOUTUBE_REFRESH_TOKEN_{idx}', '').strip()
              if not c_id or not c_sec or not r_tok:
                  print(f"⚠️ Credencial #{idx} vacía o incompleta.")
                  return None
              c = Credentials.from_authorized_user_info({
                  'client_id': c_id,
                  'client_secret': c_sec,
                  'refresh_token': r_tok,
                  'token_uri': 'https://oauth2.googleapis.com/token',
                  'scopes': ['https://www.googleapis.com/auth/youtube.upload']
              })
              c.refresh(Request())
              return c

          titulo = open('titulo.txt','r',encoding='utf-8').read().strip()[:100]
          desc = open('descripcion.txt','r',encoding='utf-8').read().strip()[:4900]
          if '#Shorts' not in desc and '#shorts' not in desc:
              desc = desc + "\n\n#Shorts #Futbol #BoxToBoxFC"

          tags = ['futbol','shorts','futbolshorts','boxtoboxfc','tactica','championsleague','laliga','premierleague','mundial2026']
          body = {
              'snippet': {
                  'title': titulo,
                  'description': desc,
                  'tags': tags,
                  'categoryId': '17'
              },
              'status': {
                  'privacyStatus': 'public',
                  'selfDeclaredMadeForKids': False
              }
          }

          for idx in orden:
              try:
                  print(f"🔄 Probando subida con Credencial #{idx} -> Título: '{titulo}'")
                  creds = get_creds(idx)
                  if not creds:
                      continue
                  yt = build('youtube', 'v3', credentials=creds)
                  req = yt.videos().insert(
                      part='snippet,status',
                      body=body,
                      media_body=MediaFileUpload('output.mp4', mimetype='video/mp4', resumable=True)
                  )
                  resp = None
                  while resp is None:
                      _, resp = req.next_chunk()
                  open('video_id.txt','w').write(resp['id'])
                  print(f"✅ PUBLICADO CON ÉXITO (Credencial #{idx}): https://youtube.com/shorts/{resp['id']}")
                  sys.exit(0)
              except HttpError as e:
                  err_txt = e.content.decode('utf-8', errors='ignore')
                  print(f"❌ HttpError en Credencial #{idx}: {err_txt[:250]}")
                  continue
              except Exception as e:
                  print(f"❌ Error general en Credencial #{idx}: {e}")
                  continue

          print("🚨 Ninguna de las 4 credenciales pudo subir el vídeo.")
          sys.exit(1)
          PYTHON_YT

          python3 /tmp/subir_yt.py
          if [ $? -eq 0 ]; then
            echo "youtube_status=✅ YouTube OK" >> $GITHUB_OUTPUT
          else
            echo "youtube_status=❌ YouTube Falló" >> $GITHUB_OUTPUT
          fi

      - name: "🧠 Actualizar memoria (Equipos + 250 IDs de Pexels sin repetir)"
        if: always()
        env:
          EQUIPO_USADO: ${{ github.event.client_payload.equipo_usado }}
        run: |
          touch ultimos_equipos.txt ultimos_pexels_ids.txt
          if [ -n "$EQUIPO_USADO" ]; then
            IFS=',' read -ra EQUIPOS_ARR <<< "$EQUIPO_USADO"
            for eq in "${EQUIPOS_ARR[@]}"; do echo "$eq" >> ultimos_equipos.txt; done
            tail -n 32 ultimos_equipos.txt > ultimos_equipos_tmp.txt
            mv ultimos_equipos_tmp.txt ultimos_equipos.txt
          fi
          if [ -s "nuevos_pexels_ids.txt" ]; then
            cat nuevos_pexels_ids.txt >> ultimos_pexels_ids.txt
            awk '!seen[$0]++' ultimos_pexels_ids.txt | tail -n 250 > ultimos_pexels_tmp.txt
            mv ultimos_pexels_tmp.txt ultimos_pexels_ids.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ultimos_equipos.txt ultimos_pexels_ids.txt
          git commit -m "Memoria: $EQUIPO_USADO + Pexels IDs" || echo "Sin cambios"
          git pull --rebase origin main 2>/dev/null || true
          git push || echo "Push fallido"
